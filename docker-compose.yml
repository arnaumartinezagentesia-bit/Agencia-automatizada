version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: enterprise-postgres
    restart: always
    environment:
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: trading_enterprise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - enterprise-network

  redis:
    image: redis:alpine
    container_name: enterprise-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - enterprise-network

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: enterprise-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - MARKET_DATA_API_KEY=${MARKET_DATA_API_KEY}
      - DATABASE_URL=postgresql://trading_user:${POSTGRES_PASSWORD}@postgres:5432/trading_enterprise
    depends_on:
      - postgres
      - redis
    networks:
      - enterprise-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: enterprise-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    networks:
      - enterprise-network

networks:
  enterprise-network:
    driver: bridge

volumes:
  postgres_data:
